name: TransitPulse CI

on:
  push:
    branches: [main, feature]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  data-engine:
    name: Data engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: data-engine/requirements.txt

      - name: Install dependencies
        working-directory: data-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic datasets
        working-directory: data-engine
        run: python generate_datasets.py --seed 42

      - name: Run unit tests
        working-directory: data-engine
        run: python -m pytest tests/ -v

      - name: Run the analytical pipeline
        working-directory: data-engine
        run: python -m transitpulse_engine.pipeline

      - name: Verify engine output exists
        working-directory: data-engine
        run: |
          test -f output/json/dashboard.json
          test -f output/json/propagation.json
          test -f output/json/worked_example.json
          test -f output/csv/delay_events.csv
          echo "Engine output verified"

      - name: Upload datasets and engine output
        uses: actions/upload-artifact@v4
        with:
          name: engine-output
          path: |
            datasets/
            data-engine/output/
          retention-days: 7

  # ------------------------------------------------------------------ #
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    needs: data-engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The backend tests load the CSV datasets, so fetch them from the
      # previous job rather than regenerating them.
      - name: Download engine output
        uses: actions/download-artifact@v4
        with:
          name: engine-output

      - name: Compile
        working-directory: backend
        run: mvn -B clean compile

      - name: Run tests
        working-directory: backend
        env:
          JWT_SECRET: "TransitPulse-CI-Only-Test-Secret-Change-This-12345678901234567890"
          JWT_EXPIRATION_MINUTES: "480"
        run: mvn -B test

      - name: Package
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/transitpulse-backend.jar
          retention-days: 7

  # ------------------------------------------------------------------ #
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run component tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ------------------------------------------------------------------ #
  contracts:
    name: SQL and API contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install checkers
        run: pip install sqlglot

      - name: Validate every SQL script parses
        run: python tests/validate_sql.py

      - name: Verify frontend calls match backend endpoints
        run: python tests/verify_api_contract.py

  # ------------------------------------------------------------------ #
  docker:
    name: Docker images (Build and Push to ECR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials using OIDC
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          tags: |
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/transitpulse-backend:${{ github.sha }}
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/transitpulse-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          tags: |
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/transitpulse-frontend:${{ github.sha }}
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/transitpulse-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push data-engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.data-engine
          push: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          tags: |
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/transitpulse-data-engine:${{ github.sha }}
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/transitpulse-data-engine:latest
          cache-from: type=gha,scope=data-engine
          cache-to: type=gha,mode=max,scope=data-engine

      - name: Validate the compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
          echo "docker-compose.yml is valid"


 
  # ------------------------------------------------------------------ #
  # Deploy to AWS EC2
  deploy:
    name: Deploy to AWS EC2
    runs-on: [self-hosted, linux, x64, transitpulse-deploy]
    timeout-minutes: 25

    needs:
      - data-engine
      - backend
      - frontend
      - contracts
      - docker

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    steps:
      - name: Deploy TransitPulse
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          cd "$HOME/TransitPulse"

          echo "Fetching latest source..."
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          echo "Authenticating with ECR..."
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          echo "Pulling application images..."
          docker compose pull backend frontend data-engine

          echo "Detecting Python engine UID/GID..."
          ENGINE_UID=$(docker compose run --rm --no-deps \
            --entrypoint sh data-engine -c 'id -u')

          ENGINE_GID=$(docker compose run --rm --no-deps \
            --entrypoint sh data-engine -c 'id -g')

          echo "Engine UID: $ENGINE_UID"
          echo "Engine GID: $ENGINE_GID"

          echo "Fixing output directory permissions..."
          sudo mkdir -p data-engine/output/csv data-engine/output/json
          sudo chown -R "$ENGINE_UID:$ENGINE_GID" data-engine/output
          sudo find data-engine/output -type d -exec chmod 755 {} \;
          sudo find data-engine/output -type f -exec chmod 644 {} \;

          
          echo "Running Python analytics engine..."
          docker compose run --rm --no-deps data-engine

          echo "Checking generated CSV files..."
          test -s data-engine/output/csv/delay_events.csv
          test -s data-engine/output/csv/propagation_results.csv
          test -s data-engine/output/csv/passenger_impact.csv

          echo "Loading analytical results into MySQL..."
          docker compose exec -T mysql sh -lc \
            'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" transitpulse' \
            < database/mysql/03_load_engine_results.sql

          echo "Verifying MySQL analytical records..."
          docker compose exec -T mysql sh -lc \
            'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -D transitpulse -e "
              SELECT '\''delay_events'\'' AS table_name, COUNT(*) AS records FROM delay_events
              UNION ALL
              SELECT '\''propagation_results'\'', COUNT(*) FROM propagation_results
              UNION ALL
              SELECT '\''passenger_impact'\'', COUNT(*) FROM passenger_impact;
            "'

          echo "Uploading analytics to S3..."
          "$HOME/transitpulse-aws-venv/bin/python" \
            data-engine/upload_to_s3.py


          echo "Deploying backend and frontend..."
          docker compose up -d --no-build --no-deps backend frontend

          echo "Checking backend..."
          for i in {1..30}; do
            if curl -fsS http://localhost/api/health >/dev/null; then
              echo "Backend healthy"
              break
            fi

            if [ "$i" -eq 30 ]; then
              docker compose logs --tail=100 backend
              exit 1
            fi
            sleep 10
          done

          echo "Checking frontend..."
          curl -fsSI http://localhost/ >/dev/null

          docker compose ps

          echo "TransitPulse ECR deployment successful!"
