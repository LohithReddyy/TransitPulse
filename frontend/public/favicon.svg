<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="TransitPulse">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b1b33"/>
  <!-- a delay trace: on time, then falling behind, then recovering -->
  <path d="M8 40 L18 40 L24 24 L32 48 L40 32 L48 32 L56 26"
        fill="none" stroke="url(#g)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="48" r="4" fill="#ef4444"/>
</svg>
