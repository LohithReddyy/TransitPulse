
services:
  mysql:
    image: mysql:8.0
    container_name: transitpulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-transitpulse}
      MYSQL_USER: ${MYSQL_USER:-transitpulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/mysql/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
      - ./data-engine/output/csv:/var/lib/mysql-files/transitpulse
    command: --secure-file-priv=/var/lib/mysql-files --local-infile=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - transitpulse

  data-engine:
    image: 535203104590.dkr.ecr.us-east-1.amazonaws.com/transitpulse-data-engine:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.data-engine
    container_name: transitpulse-data-engine
    environment:
      TRANSITPULSE_DATASETS_DIR: /app/datasets
      TRANSITPULSE_OUTPUT_DIR: /app/output
    volumes:
      - ./datasets:/app/datasets
      - ./data-engine/output:/app/output
    restart: "no"
    networks:
      - transitpulse

  backend:
    image: 535203104590.dkr.ecr.us-east-1.amazonaws.com/transitpulse-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: transitpulse-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: ${SERVER_PORT:-8080}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-transitpulse}
      MYSQL_USER: ${MYSQL_USER:-transitpulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      TRANSITPULSE_CORS_ORIGINS: ${TRANSITPULSE_CORS_ORIGINS:-http://localhost:3000}
      TRANSITPULSE_LOAD_DATASETS: ${TRANSITPULSE_LOAD_DATASETS:-false}
    volumes:
      - ./datasets:/app/datasets:ro
      - ./data-engine/output:/app/engine-output:ro
    depends_on:
      mysql:
        condition: service_healthy
      data-engine:
        condition: service_completed_successfully
    networks:
      - transitpulse

  frontend:
    image: 535203104590.dkr.ecr.us-east-1.amazonaws.com/transitpulse-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: transitpulse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - transitpulse
  prometheus:
    image: 535203104590.dkr.ecr.us-east-1.amazonaws.com/transitpulse-prometheus:v3.5.0
    container_name: transitpulse-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    networks:
      - transitpulse

  grafana:
    image: 535203104590.dkr.ecr.us-east-1.amazonaws.com/transitpulse-grafana:12.1.0
    container_name: transitpulse-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - transitpulse

  node-exporter:
    image: 535203104590.dkr.ecr.us-east-1.amazonaws.com/transitpulse-node-exporter:v1.9.1
    container_name: transitpulse-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    expose:
      - "9100"
    networks:
      - transitpulse

  cadvisor:
    image: 535203104590.dkr.ecr.us-east-1.amazonaws.com/transitpulse-cadvisor:v0.52.1
    container_name: transitpulse-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - transitpulse

volumes:
  mysql-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  transitpulse:
    driver: bridge
